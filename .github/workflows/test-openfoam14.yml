name: AATE OpenFOAM 14 and pyaate tests

run-name: Test AATE against OpenFOAM 14

on:
  push:
    paths-ignore:
      - README.md

  pull_request:
    paths-ignore:
      - README.md

  schedule:
    - cron: "0 10 * * 0"

  workflow_dispatch:

concurrency:
  group: openfoam14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build with OpenFOAM 14 and test pyaate
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyaate/pyproject.toml
          python-version: "3.11"

      - name: Install OpenFOAM 14
        run: |
          wget -qO- https://dl.openfoam.org/gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/openfoam.asc > /dev/null

          sudo add-apt-repository -y \
            "http://dl.openfoam.org/ubuntu main"

          sudo sed -i \
            "s/^\(deb\).*\(http:\/\/dl\.openfoam\.org\/ubuntu\)/\1 [arch=amd64] \2/" \
            /etc/apt/sources.list.d/*dl_openfoam_org*list

          sudo apt-get update
          sudo apt-get install -y openfoam14

      - name: Show OpenFOAM environment
        run: |
          source /opt/openfoam14/etc/bashrc

          echo "WM_PROJECT_VERSION=$WM_PROJECT_VERSION"
          echo "WM_PROJECT_DIR=$WM_PROJECT_DIR"
          echo "FOAM_USER_LIBBIN=$FOAM_USER_LIBBIN"
          echo "FOAM_USER_APPBIN=$FOAM_USER_APPBIN"

          which wmake
          wmake -help > /dev/null

      - name: Compile AATE libraries and applications
        run: |
          source /opt/openfoam14/etc/bashrc

          chmod +x Allwmake src/Allwmake applications/Allwmake
          ./Allwmake -j

      - name: Build and install pyaate
        working-directory: pyaate
        run: |
          uv build
          uv sync

      - name: Run pyaate tests
        working-directory: pyaate
        run: |
          source /opt/openfoam14/etc/bashrc
          uv run python -m unittest discover -s pyaate/tests -b

      - name: Show compiled artifacts
        run: |
          source /opt/openfoam14/etc/bashrc

          echo "Libraries under FOAM_USER_LIBBIN:"
          find "$FOAM_USER_LIBBIN" \
            -maxdepth 1 \
            -type f \
            -name '*.so' \
            -print 2>/dev/null || true

          echo
          echo "Applications under FOAM_USER_APPBIN:"
          find "$FOAM_USER_APPBIN" \
            -maxdepth 1 \
            -type f \
            -print 2>/dev/null || true
